[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-postprocess"
dynamic = ["version"]  # version derived from git tags via setuptools_scm
description = "SPIReS postprocessing: canopy, ice, cloud gap-fill, and inpainting"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "canopy", "glacier ice", "inpainting"]
dependencies = [
    "spires-contract @ git+https://github.com/RittgerLabGroup/spires-contract.git@dda5155c9af5d4976d67de0fb6de1ff1d73d080d",
    "numpy",
    "xarray",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/RittgerLabGroup/spires-postprocess"
Repository = "https://github.com/RittgerLabGroup/spires-postprocess"

[tool.setuptools.packages.find]
where = ["./"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["./"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
